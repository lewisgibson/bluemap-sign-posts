# Every dependency and plugin version, pinned. Dependabot updates them.

[versions]
# Paper API for Minecraft 26.3, build 174, the newest on 2026-10-11. Paper's artifact
# scheme since the 26.x boundary is "<mcver>.build.<n>-<channel>", not the old
# "-R0.1-SNAPSHOT".
paperApi = "26.2.build.134-stable"
# The Paper API the MockBukkit integration tests run on: the newest 26.2 build, matching
# mockbukkit-v26.2 (see the mockbukkit library below).
paperApiMockBukkit = "26.2.build.134-stable"
# BlueMapAPI 2.8.2 is the API BlueMap 5.29 targets (the "Targets" block of its release notes),
# so a jar built against it matches the server's BlueMap.
bluemapApi = "2.8.2"
junit = "6.1.3"
mockbukkit = "4.117.0"
assertj = "3.27.7"
jacoco = "0.8.15"
# 1.37.0 is newer but Spotless 8.10.4 (the newest, checked 2026-10-11) cannot drive it: every file fails with an
# InvocationTargetException. Move with the next Spotless release.
googleJavaFormat = "1.36.1"
spotless = "8.10.4"
runPaper = "3.1.0"
jmhPlugin = "0.7.3"
jmh = "1.37"
# The connection pool and the drivers the PostgreSQL and MySQL stores use. Not bundled: the
# build writes these versions into plugin.yml `libraries:` and Paper downloads them.
hikaricp = "7.1.0"
postgresql = "42.7.14"
mariadbJdbc = "4.0.0"
# The SQLite driver Paper 26.3 ships, which is the one the plugin runs on (a plugin cannot load
# its own copy over the server's). Compiled and tested against the same version.
sqliteJdbc = "3.49.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
paper-api-mockbukkit = { module = "io.papermc.paper:paper-api", version.ref = "paperApiMockBukkit" }
bluemap-api = { module = "de.bluecolored:bluemap-api", version.ref = "bluemapApi" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# MockBukkit ships a version-locked artifact per Minecraft version: mockbukkit-v<mcver>.
# There is no mockbukkit-v26.3 yet (upstream's upgrade/v26.3 branch is unreleased), and the
# 26.2 one cannot load its registry data under the 26.3 API, so the integration tests run on
# paper-api-mockbukkit, the 26.2 API it was built for. The real 26.3 is covered by serverTest.
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadbJdbc" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
