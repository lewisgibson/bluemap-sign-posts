name: Build

on:
    workflow_dispatch: {}
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    build:
        name: Build & Test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7.0.1

            - name: Set Up JDK
              uses: actions/setup-java@v6.1.0
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Set Up Gradle
              uses: gradle/actions/setup-gradle@v6.4.0

            - name: Build, Test, Verify Formatting & Coverage
              run: ./gradlew build --stacktrace

            - name: Upload Plugin Jar
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: plugin-jar
                  path: build/libs/BlueMapSignPosts-*.jar
                  if-no-files-found: error

            - name: Upload Reports
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: reports
                  path: |
                      build/reports/tests/
                      build/reports/jacoco/
                  if-no-files-found: ignore

    load-test:
        name: Load Test (${{ matrix.server }})
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                # FOLIA joins when Folia 26.3 is released; a 26.3 jar refuses to load on Folia 26.2.
                server: [PAPER, PURPUR]
        steps:
            - name: Download Plugin Jar
              uses: actions/download-artifact@v8.0.2
              with:
                  name: plugin-jar
                  path: data/plugins

            - name: Boot ${{ matrix.server }} and Verify the Plugin Publishes to BlueMap
              env:
                  SERVER: ${{ matrix.server }}
                  MC_VERSION: '26.3'
                  # The same BlueMap and image as src/serverTest's PaperServer.
                  BLUEMAP_PIN: 'bluemap:5.29-paper'
                  IMAGE: 'itzg/minecraft-server:java25@sha256:03d12ffd613cb085e4285c0dc1e2b7eaa92cb09422d3820809314f9b7ae0dd4a'
              run: |
                  set -euo pipefail

                  # BlueMap enables its API, and so calls the plugin back, only once the download of
                  # Mojang's resources is accepted.
                  mkdir -p data/plugins/BlueMap
                  printf 'accept-download: true\nrender-thread-count: 1\nmetrics: false\n' > data/plugins/BlueMap/core.conf

                  docker run -d --name mc \
                      -e EULA=TRUE \
                      -e TYPE="$SERVER" \
                      -e VERSION="$MC_VERSION" \
                      -e ONLINE_MODE=FALSE \
                      -e MAX_TICK_TIME=-1 \
                      -e MEMORY=2G \
                      -e MODRINTH_PROJECTS="$BLUEMAP_PIN" \
                      -v "$PWD/data:/data" \
                      "$IMAGE"

                  # The plugin logs this line once it has opened its store and BlueMap has called it back,
                  # which proves more than the plugin loading. A first boot downloads the server and
                  # generates a world, hence the long wait.
                  deadline=$((SECONDS + 900))
                  while [ "$SECONDS" -lt "$deadline" ]; do
                      logs="$(docker logs mc 2>&1 || true)"
                      if echo "$logs" | grep -q "\[BlueMapSignPosts\] BlueMap is up: published"; then
                          echo "::notice::BlueMapSignPosts published to BlueMap on ${SERVER}"
                          echo "$logs" | grep "BlueMapSignPosts" || true
                          docker rm -f mc >/dev/null 2>&1 || true
                          exit 0
                      fi
                      if echo "$logs" | grep -qE "Error occurred while enabling BlueMapSignPosts|Could not load 'plugins|Disabling BlueMapSignPosts"; then
                          echo "::error::BlueMapSignPosts failed to load on ${SERVER}"
                          echo "$logs" | tail -n 120
                          docker rm -f mc >/dev/null 2>&1 || true
                          exit 1
                      fi
                      sleep 10
                  done

                  echo "::error::Timed out waiting for BlueMapSignPosts to publish on ${SERVER}"
                  docker logs mc 2>&1 | tail -n 120 || true
                  exit 1

    server-tests:
        name: Server Tests
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7.0.1

            - name: Set Up JDK
              uses: actions/setup-java@v6.1.0
              with:
                  distribution: temurin
                  java-version: '25'

            - name: Set Up Gradle
              uses: gradle/actions/setup-gradle@v6.4.0

            - name: Boot Real Servers and Observe the Markers
              run: ./gradlew serverTest --no-daemon
